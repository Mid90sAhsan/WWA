# Rebuilds and deploys the site to Cloudflare Workers.
#
# The Mon/Wed/Fri schedule publishes queued notes: anything in content/notes
# whose `date` has arrived is included in the build (see lib/notes.ts).
# 13:00 UTC is 8am Eastern in winter, 9am in summer.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  – the account ID shown by `npx wrangler whoami`
name: Deploy

on:
  schedule:
    - cron: "0 13 * * 1,3,5"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
